name: Test dexie_web

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main

      - name: Check command entrypoints
        run: nix shell --inputs-from . nixpkgs#nodejs_24 nixpkgs#just --command node --test tool/chainman_argv.test.mjs tool/test_web_wrapper.test.mjs

      - name: Verify
        env:
          E2E_TIMEOUT_SECONDS: "900"
          CHAINMAN_SETUP: auto
          CHAINMAN_MODE: host-nix
        shell: bash
        run: |
          mkdir -p test-results
          nix run --inputs-from . nixpkgs#just -- verify 2>&1 | tee test-results/verify.log

      - name: Upload verification diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verification-diagnostics
          path: |
            test-results
            example/test-results
          if-no-files-found: warn
