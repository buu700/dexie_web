name: Test dexie_web

on:
  push:
    branches-ignore: [automation/deps-update]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: master

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22.0.0
        with:
          # Bound download concurrency on hosted runners and use the upstream cache.
          extra-conf: |
            http-connections = 8

      - name: Check command entrypoints
        run: nix shell --inputs-from . nixpkgs#nodejs_24 nixpkgs#just --command node --test tool/chainman_argv.test.mjs tool/test_web_wrapper.test.mjs tool/update_diagnostics.test.mjs

      - name: Verify
        env:
          E2E_TIMEOUT_SECONDS: "900"
          CHAINMAN_SETUP: auto
          CHAINMAN_MODE: host-nix
        shell: bash
        run: |
          mkdir -p test-results
          nix shell --inputs-from . nixpkgs#dbus --command ./tool/ci-session.sh \
            nix run --inputs-from . nixpkgs#just -- verify 2>&1 | tee test-results/verify.log

      - name: Upload verification diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-diagnostics
          path: |
            test-results
            example/test-results
          if-no-files-found: warn
