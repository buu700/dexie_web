name: Update dependencies

on:
  workflow_dispatch:
    inputs:
      target:
        description: Update all dependencies or only the Nix SDK and its dependent pins
        type: choice
        default: all
        options: [all, nix]
  push:
    branches: [automation/deps-update]

permissions:
  contents: read

concurrency:
  group: deps-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CHAINMAN_MODE: host-nix
      CHAINMAN_SETUP: auto
      E2E_TIMEOUT_SECONDS: "900"
      GITHUB_TOKEN: ${{ github.token }}
      UPDATE_RECIPE: ${{ inputs.target == 'nix' && 'deps-update-nix' || 'deps-update' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: master

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22.0.0
        with:
          # Bound download concurrency on hosted runners and use the upstream cache.
          extra-conf: |
            http-connections = 8
            # Nested task launches can contend on the optional SQLite eval cache.
            eval-cache = false

      - name: Resolve, reconcile and verify dependencies
        shell: bash
        run: |
          git config user.name 'Dependency maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p test-results
          nix shell --inputs-from . nixpkgs#dbus --command ./tool/ci-session.sh \
            nix run --inputs-from . nixpkgs#just -- "$UPDATE_RECIPE" --json \
            2> >(tee test-results/deps-update.log >&2) | tee test-results/deps-update.json
          git diff --binary "$GITHUB_SHA" HEAD > test-results/deps-update.patch

      - name: Preserve failed candidate and browser diagnostics
        if: failure()
        shell: bash
        run: |
          ./tool/collect-update-diagnostics.sh

      - name: Upload dependency update and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-update
          path: |
            test-results
            example/test-results
          if-no-files-found: warn
