name: Update dependencies

on:
  workflow_dispatch:
  push:
    branches: [automation/deps-update]

permissions:
  contents: read

concurrency:
  group: deps-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CHAINMAN_MODE: host-nix
      CHAINMAN_SETUP: auto
      E2E_TIMEOUT_SECONDS: "900"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main

      - name: Resolve, reconcile and verify dependencies
        shell: bash
        run: |
          git config user.name 'Dependency maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p test-results
          nix run --inputs-from . nixpkgs#just -- deps-update --json \
            2> >(tee test-results/deps-update.log >&2) | tee test-results/deps-update.json
          git diff --binary "$GITHUB_SHA" HEAD > test-results/deps-update.patch

      - name: Upload dependency update and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-update
          path: |
            test-results
            example/test-results
          if-no-files-found: warn
