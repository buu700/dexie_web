schema = 2

[project]
name = "dexie-web"
default_profile = "default"

[profiles.default]
flake = "flake.nix#default"

[profiles.services]
flake = "flake.nix#services"

[environment]
pass = ["CHROME_EXECUTABLE", "CI", "E2E_TIMEOUT_SECONDS", "LANG", "LC_ALL"]

[setup.javascript]
inputs = ["package.json", "package-lock.json"]
artifacts = ["node_modules/dexie/dist/dexie.min.js", "node_modules/.package-lock.json"]
commands = [["npm", "ci", "--ignore-scripts"]]

[setup.dart]
inputs = ["pubspec.yaml", "pubspec.lock"]
artifacts = [".dart_tool/package_config.json"]
commands = [["flutter", "clean"], ["flutter", "pub", "get", "--enforce-lockfile"]]

[setup.example]
depends_on = ["dart"]
directory = "example"
inputs = ["pubspec.yaml", "pubspec.lock", "example/pubspec.yaml", "example/pubspec.lock"]
artifacts = ["example/.dart_tool/package_config.json"]
commands = [["rm", "-f", "test_bundle.dart"], ["flutter", "clean"], ["flutter", "pub", "get", "--enforce-lockfile"]]

[updates]
profile = "default"
eligibility = "resolver"
minimum_age_days = 30
verify_task = "ci-local"
reconcile_tasks = ["bundle"]
outputs = [
    "assets/dexie.d.ts",
    "assets/dexie.min.js",
    "lib/src/dexie_sri.g.dart",
    "package-lock.json",
    "package.json",
    "flake.lock",
    "pubspec.yaml",
    "pubspec.lock",
    "example/pubspec.yaml",
    "example/pubspec.lock",
    ".github/workflows/*.yml",
    ".github/workflows/*.yaml",
]

[updates.adapters.nix]
adapter = "nix"
profile = "core"

[[updates.adapters.nix.inputs]]
directory = "."
input = "nixpkgs"
repository = "NixOS/nixpkgs"
branch = "nixos-unstable"

[[updates.adapters.nix.inputs]]
directory = "."
input = "flake-utils"
repository = "numtide/flake-utils"
branch = "main"

[updates.adapters.js]
adapter = "javascript"
directory = "."
profile = "default"
manager = "npm"

[updates.adapters.github]
adapter = "actions"
files = [".github/workflows/*.yml", ".github/workflows/*.yaml"]
profile = "core"

[updates.adapters.flutter]
adapter = "flutter"
profile = "default"
directories = [".", "example"]

[[updates.steps]]
resolve = "nix"

[[updates.steps]]
resolve = "js"

[[updates.steps]]
resolve = "flutter"

[[updates.steps]]
resolve = "github"

[tasks.bundle]
commands = [["./tool/bundle.sh"]]
setup = ["javascript"]

[tasks.bootstrap-ci]
setup = ["dart", "example"]
depends_on = ["bundle"]
profile = "host"

[tasks.bootstrap]
commands = [["lefthook", "install"]]
depends_on = ["bootstrap-ci"]

[tasks.analyze]
commands = [["flutter", "analyze", "--no-pub"]]
setup = ["dart", "example"]

[tasks.parity-check]
commands = [["dart", "run", "tool/check_dexie_parity.dart"]]
setup = ["dart"]

[tasks.test-tooling]
commands = [["node", "--test", "tool/chainman_argv.test.mjs"], ["flutter", "test", "--no-pub", "tool/integration_report_test.dart"]]
setup = ["dart"]

[tasks.test-vm]
commands = [["flutter", "test", "--no-pub"]]
setup = ["dart"]
depends_on = ["test-tooling"]

[tasks.test-web]
timeout_seconds = 600
commands = [["./tool/test-web.sh"]]
setup = ["dart"]
cleanup_children = true

[tasks.e2e-prepare-ci]
commands = [["sh", "-c", "printf '%s\\n' 'Nix supplies the browser and matching ChromeDriver; no browser downloads are needed.'"]]
profile = "host"

[tasks.e2e]
services = ["chrome-driver"]
network_service = "chrome-driver"
commands = [["./tool/e2e.sh"]]
setup = ["dart", "example"]
depends_on = ["bundle"]
cleanup_children = true
timeout_seconds = 600
timeout_env = "E2E_TIMEOUT_SECONDS"
shutdown_seconds = 15

[tasks.check]
depends_on = ["format-check", "parity-check", "analyze", "test-web", "test-tooling"]
profile = "host"

[tasks.ci-local]
depends_on = ["bootstrap-ci", "format-check", "parity-check", "analyze", "test-web", "test-tooling", "e2e"]
profile = "host"

[tasks.publish-dry-run]
commands = [["flutter", "pub", "publish", "--dry-run"]]
setup = ["dart"]

[tasks.publish]
commands = [["flutter", "pub", "publish"]]
setup = ["dart"]

[tasks.hooks-install]
commands = [["lefthook", "install"]]

[tasks.clean]
commands = [["./tool/clean.sh"]]
exclusive = true
cleanup_children = true

# Flutter's SDK integration runner uses the standard WebDriver protocol. Chainman
# owns this foreground service and its browser children for the E2E task lifetime.

[tasks.format-write]
commands = [["dart", "format", "lib", "test", "example/lib", "example/test", "example/integration_test", "example/test_driver", "tool"], ["bash", "-eu", "-c", "npx prettier --write \"**/*.{json,js,html,yaml}\""]]
setup = ["javascript"]

[tasks.format-check]
commands = [["dart", "format", "--output=none", "--set-exit-if-changed", "lib", "test", "example/lib", "example/test", "example/integration_test", "example/test_driver", "tool"], ["npx", "prettier", "--check", "**/*.{json,js,html,yaml}"]]
setup = ["javascript", "dart", "example"]

[services.chrome-driver]
profile = "services"
command = ["chromedriver", "--port=4444"]
[services.chrome-driver.readiness]
# WebDriver stays private to its shared test/container network namespace.
# The outer deadline includes bootstrap and Nix profile entry; bound the HTTP
# request separately so an unresponsive endpoint does not consume that allowance.
command = ["curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:4444/status"]
period_seconds = 1
timeout_seconds = 30
failure_threshold = 6

[recipes]
format-write = ["format-write"]
format-check = ["format-check"]
generate = ["bundle"]
clean = ["clean"]
setup = ["bootstrap"]
verify-lite = ["check"]
verify = ["ci-local"]

[dependencies]
exclusions = []
